apply plugin: 'com.android.application'

android {
    namespace "com.digitalimpulso.xubio.totem"
    compileSdk 34

    defaultConfig {
        applicationId "com.digitalimpulso.xubio.totem"
        // minSdk 26: así el ícono adaptativo (mipmap-anydpi-v26) no necesita
        // un fallback PNG para versiones viejas, que acá no hay forma de generar.
        minSdk 26
        targetSdk 34
        versionCode project.hasProperty('appVersionCode') ? (project.property('appVersionCode') as Integer) : 1
        versionName project.hasProperty('appVersionName') ? project.property('appVersionName') : "0.1.0"
    }

    buildTypes {
        debug {
            // Firma de debug (fija, la misma en cualquier instalación del SDK de
            // Android) — alcanza para sideload/kiosco. Las actualizaciones
            // instalan limpio porque esa clave es siempre la misma. Pasar a una
            // keystore de release propia queda documentado en el README del repo
            // para cuando haga falta.
        }
    }
}

// Alguna dependencia transitiva de AndroidX todavía pide los artifacts viejos
// kotlin-stdlib-jdk7/jdk8 (separados). Desde Kotlin 1.8, kotlin-stdlib ya los
// trae fusionados adentro — tenerlos los dos a la vez duplica las mismas
// clases y Gradle lo rechaza (checkDebugDuplicateClasses). No se declaró
// Kotlin a mano en este proyecto; esto solo excluye los módulos redundantes.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
