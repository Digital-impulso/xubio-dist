name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: >
          gradle -p android assembleDebug
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=0.1.${{ github.run_number }}
      - name: Preparar el artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk XubioTotem.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: XubioTotem.apk

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar windows/
        run: cd windows && zip -r ../XubioTotem-Windows.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: XubioTotem-Windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Calcular el tag de esta versión
        id: tag
        run: echo "tag=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/android-apk/XubioTotem.apk
            dist/windows-zip/XubioTotem-Windows.zip
